<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
  <title id="title">Two-loop block diagram with a disturbance and a feedforward path</title>
  <desc id="desc">The reference R enters the positive input of a summing junction whose negative input is the output Y. The error drives block G1. A second summing junction adds the output of G1 and a feedforward signal from R through block G3, and subtracts a signal from Y through block H1. A third summing junction adds the disturbance W, and its output drives block G2, which produces Y. The outer loop feeds Y back to the first junction with a negative sign.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1040" height="400" fill="white"/>
  <g fill="none" stroke="#222" stroke-width="2.2" stroke-linejoin="round">
    <circle cx="170" cy="200" r="26"/>
    <rect x="270" y="160" width="110" height="80"/>
    <circle cx="490" cy="200" r="26"/>
    <circle cx="610" cy="200" r="26"/>
    <rect x="700" y="160" width="110" height="80"/>
    <rect x="270" y="40" width="110" height="60"/>
    <rect x="435" y="300" width="110" height="60"/>
    <path d="M60 200 H142" marker-end="url(#arrow)"/>
    <path d="M196 200 H268" marker-end="url(#arrow)"/>
    <path d="M380 200 H462" marker-end="url(#arrow)"/>
    <path d="M516 200 H582" marker-end="url(#arrow)"/>
    <path d="M636 200 H698" marker-end="url(#arrow)"/>
    <path d="M810 200 H980" marker-end="url(#arrow)"/>
    <path d="M100 200 V70 H268" marker-end="url(#arrow)"/>
    <path d="M380 70 H490 V172" marker-end="url(#arrow)"/>
    <path d="M610 110 V172" marker-end="url(#arrow)"/>
    <path d="M900 200 V330 H547" marker-end="url(#arrow)"/>
    <path d="M490 300 V228" marker-end="url(#arrow)"/>
    <path d="M940 200 V380 H170 V228" marker-end="url(#arrow)"/>
    <circle cx="100" cy="200" r="4" fill="#222"/>
    <circle cx="900" cy="200" r="4" fill="#222"/>
    <circle cx="940" cy="200" r="4" fill="#222"/>
    <circle cx="610" cy="103" r="5"/>
  </g>
  <g fill="#222" font-family="Georgia, 'Times New Roman', serif" font-size="28" text-anchor="middle">
    <text x="40" y="209" font-style="italic">R</text>
    <text x="1005" y="209" font-style="italic">Y</text>
    <text x="610" y="90" font-style="italic">W</text>
    <text x="170" y="210">Σ</text>
    <text x="490" y="210">Σ</text>
    <text x="610" y="210">Σ</text>
    <text x="132" y="180">+</text>
    <text x="144" y="246">−</text>
    <text x="452" y="180">+</text>
    <text x="510" y="160">+</text>
    <text x="512" y="248">−</text>
    <text x="572" y="180">+</text>
    <text x="630" y="160">+</text>
    <text x="325" y="210" font-style="italic">G<tspan baseline-shift="sub" font-size="19" font-style="normal">1</tspan></text>
    <text x="755" y="210" font-style="italic">G<tspan baseline-shift="sub" font-size="19" font-style="normal">2</tspan></text>
    <text x="325" y="80" font-style="italic">G<tspan baseline-shift="sub" font-size="19" font-style="normal">3</tspan></text>
    <text x="490" y="340" font-style="italic">H<tspan baseline-shift="sub" font-size="19" font-style="normal">1</tspan></text>
  </g>
</svg>
