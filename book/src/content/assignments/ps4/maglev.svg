<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic levitation of a steel ball</title>
  <desc id="desc">An electromagnet with a coil carrying current i is mounted under a fixed support. A steel ball hangs below it. The gap x is measured downward from the magnet face to the top of the ball. The magnetic force k i squared over x squared acts upward on the ball and gravity m g acts downward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="620" height="460" fill="white"/>
  <g fill="none" stroke="#222" stroke-width="2.2" stroke-linejoin="round">
    <rect x="140" y="20" width="300" height="22" fill="url(#hatch)"/>
    <path d="M140 42 H440"/>
    <rect x="220" y="42" width="140" height="90" fill="#eee"/>
    <path d="M220 66 H360 M220 90 H360 M220 114 H360" stroke-width="1.5"/>
    <path d="M100 160 V100 H220" marker-end="url(#arrow)"/>
    <path d="M360 100 H480 V160"/>
    <circle cx="290" cy="262" r="42" fill="#ddd"/>
    <path d="M290 218 V165" marker-end="url(#arrow)"/>
    <path d="M290 306 V360" marker-end="url(#arrow)"/>
    <path d="M360 132 H540" stroke-dasharray="6 5" stroke-width="1.5"/>
    <path d="M332 220 H540" stroke-dasharray="6 5" stroke-width="1.5"/>
    <path d="M520 134 V218" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g fill="#222" font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="middle">
    <text x="290" y="84" font-size="21">coil</text>
    <text x="70" y="140" font-style="italic">i</text>
    <text x="550" y="186" font-style="italic">x</text>
    <text x="212" y="195" font-style="italic">k i<tspan baseline-shift="super" font-size="17">2</tspan>/x<tspan baseline-shift="super" font-size="17">2</tspan></text>
    <text x="330" y="385" font-style="italic">m g</text>
    <text x="290" y="270" font-size="20">ball</text>
    <text x="290" y="425" font-size="20">gap x measured downward from the magnet face</text>
  </g>
</svg>
